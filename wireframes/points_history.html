<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375" />
  <title>ShallWe — 포인트 내역</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 40px;
      font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    }
    .phone {
      width: 375px;
      min-height: 812px;
      background: #fff;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 14px 24px 8px;
      font-size: 12px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .status-right { display: flex; gap: 6px; font-size: 11px; }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 24px 16px;
    }
    .back-btn { font-size: 20px; color: #1a1a1a; cursor: pointer; }
    .header-title { font-size: 18px; font-weight: 700; color: #1a1a1a; }

    .scroll-area { flex: 1; overflow-y: auto; padding: 0 20px 32px; }

    /* 총 포인트 카드 */
    .total-card {
      background: #4caf7d;
      border-radius: 20px;
      padding: 24px 20px;
      margin-bottom: 24px;
      text-align: center;
    }
    .total-label { font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 6px; }
    .total-value { font-size: 36px; font-weight: 800; color: #fff; }
    .total-unit { font-size: 18px; font-weight: 600; margin-left: 4px; }

    /* 날짜 그룹 */
    .date-group { margin-bottom: 20px; }
    .date-label {
      font-size: 12px;
      font-weight: 600;
      color: #999;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* 내역 카드 */
    .history-card {
      background: #f7f9f7;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
    }
    .history-item + .history-item {
      border-top: 1px solid #eee;
    }
    .history-left { display: flex; align-items: center; gap: 12px; }
    .history-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .history-info {}
    .history-name { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 2px; }
    .history-time { font-size: 12px; color: #aaa; }
    .history-point {
      font-size: 15px;
      font-weight: 700;
      color: #4caf7d;
    }

    /* 사용처 안내 */
    .coming-soon {
      background: #f7f9f7;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      margin-top: 8px;
    }
    .coming-icon { font-size: 28px; margin-bottom: 8px; }
    .coming-title { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .coming-sub { font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-right"><span>●●●</span><span>🔋</span></div>
  </div>

  <div class="header">
    <span class="back-btn">←</span>
    <span class="header-title">포인트 내역</span>
  </div>

  <div class="scroll-area">

    <div class="total-card">
      <div class="total-label">누적 포인트</div>
      <div class="total-value">240<span class="total-unit">P</span></div>
    </div>

    <div class="date-group">
      <div class="date-label">오늘 · 03.30</div>
      <div class="history-card">
        <div class="history-item">
          <div class="history-left">
            <div class="history-icon">🍀</div>
            <div class="history-info">
              <div class="history-name">챌린지 완수</div>
              <div class="history-time">오후 3:22</div>
            </div>
          </div>
          <div class="history-point">+10P</div>
        </div>
        <div class="history-item">
          <div class="history-left">
            <div class="history-icon">📔</div>
            <div class="history-info">
              <div class="history-name">다이어리 기록</div>
              <div class="history-time">오전 11:05</div>
            </div>
          </div>
          <div class="history-point">+5P</div>
        </div>
      </div>
    </div>

    <div class="date-group">
      <div class="date-label">어제 · 03.29</div>
      <div class="history-card">
        <div class="history-item">
          <div class="history-left">
            <div class="history-icon">🍀</div>
            <div class="history-info">
              <div class="history-name">챌린지 완수</div>
              <div class="history-time">오후 5:14</div>
            </div>
          </div>
          <div class="history-point">+10P</div>
        </div>
        <div class="history-item">
          <div class="history-left">
            <div class="history-icon">📔</div>
            <div class="history-info">
              <div class="history-name">다이어리 기록</div>
              <div class="history-time">오후 9:30</div>
            </div>
          </div>
          <div class="history-point">+5P</div>
        </div>
      </div>
    </div>

    <div class="date-group">
      <div class="date-label">03.28</div>
      <div class="history-card">
        <div class="history-item">
          <div class="history-left">
            <div class="history-icon">🍀</div>
            <div class="history-info">
              <div class="history-name">챌린지 완수</div>
              <div class="history-time">오후 2:50</div>
            </div>
          </div>
          <div class="history-point">+10P</div>
        </div>
        <div class="history-item">
          <div class="history-left">
            <div class="history-icon">📔</div>
            <div class="history-info">
              <div class="history-name">다이어리 기록</div>
              <div class="history-time">오후 8:15</div>
            </div>
          </div>
          <div class="history-point">+5P</div>
        </div>
      </div>
    </div>

    <div class="coming-soon">
      <div class="coming-icon">🎁</div>
      <div class="coming-title">포인트 사용처</div>
      <div class="coming-sub">추후 업데이트 예정이에요</div>
    </div>

  </div>
</div>
</body>
</html>
