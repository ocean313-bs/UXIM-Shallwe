<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375" />
  <title>ShallWe — 마이페이지</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px;
      font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    }

    .phone {
      width: 375px;
      min-height: 812px;
      background: #ffffff;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }

    /* 상태바 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px 8px;
      font-size: 12px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .status-right {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 11px;
    }

    /* 헤더 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 24px 16px;
    }
    .header-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #555;
    }

    /* 스크롤 영역 */
    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 0 20px 24px;
    }

    /* 프로필 카드 */
    .profile-card {
      background: #f7f9f7;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .profile-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #d4ead4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }
    .profile-info {}
    .profile-name {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 2px;
    }
    .profile-sub {
      font-size: 12px;
      color: #888;
    }

    .divider-thin {
      height: 1px;
      background: #e8e8e8;
      margin: 14px 0;
    }

    .challenge-label {
      font-size: 13px;
      color: #888;
      margin-bottom: 8px;
    }
    .challenge-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .challenge-name {
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .challenge-meta {
      font-size: 12px;
      color: #4caf7d;
      font-weight: 600;
    }
    .progress-bar-wrap {
      height: 8px;
      background: #e5e5e5;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 33%;
      background: #4caf7d;
      border-radius: 99px;
    }

    .point-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .point-label {
      font-size: 13px;
      color: #888;
    }
    .point-value {
      font-size: 16px;
      font-weight: 700;
      color: #1a1a1a;
    }
    .point-unit {
      font-size: 12px;
      font-weight: 600;
      color: #4caf7d;
      margin-left: 2px;
    }

    /* AI 말투 설정 */
    .section-card {
      background: #f7f9f7;
      border-radius: 20px;
      padding: 16px 20px;
      margin-bottom: 12px;
    }
    .section-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .section-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .section-icon { font-size: 18px; }

    .toggle-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .toggle-btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 10px;
      border: 1.5px solid #e0e0e0;
      background: #fff;
      font-size: 13px;
      font-weight: 500;
      color: #888;
      text-align: center;
      cursor: pointer;
    }
    .toggle-btn.active {
      border-color: #4caf7d;
      background: #edf7f1;
      color: #4caf7d;
      font-weight: 700;
    }

    /* 메뉴 리스트 */
    .menu-card {
      background: #f7f9f7;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .menu-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      cursor: pointer;
    }
    .menu-item + .menu-item {
      border-top: 1px solid #eeeeee;
    }
    .menu-left {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: #1a1a1a;
    }
    .menu-icon { font-size: 18px; }
    .menu-arrow {
      font-size: 14px;
      color: #bbb;
    }

    /* 계정 메뉴 */
    .menu-card.account .menu-left {
      color: #555;
    }
    .menu-item.logout .menu-left {
      color: #e05555;
    }

    /* 내 게시글 섹션 */
    .section-title {
      font-size: 14px;
      font-weight: 700;
      color: #1a1a1a;
      margin: 20px 0 12px;
    }
    .feed-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      border-radius: 12px;
      overflow: hidden;
    }
    .feed-thumb {
      aspect-ratio: 1;
      background: #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .feed-thumb::after {
      content: '';
      width: 24px;
      height: 24px;
      border-radius: 4px;
      border: 2px solid #ccc;
      background: none;
    }

    /* 하단 네비게이션 */
    .bottom-nav {
      height: 80px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      padding-bottom: 16px;
      background: #fff;
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      flex: 1;
      cursor: pointer;
    }
    .nav-icon { font-size: 22px; opacity: 0.4; }
    .nav-icon.active { opacity: 1; }
    .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #4caf7d;
    }
    .nav-dot.hidden { visibility: hidden; }
  </style>
</head>
<body>
  <div class="phone">

    <!-- 상태바 -->
    <div class="status-bar">
      <span>9:41</span>
      <div class="status-right">
        <span>●●●</span>
        <span>🔋</span>
      </div>
    </div>

    <!-- 헤더 -->
    <div class="header">
      <span class="header-title">마이페이지</span>
    </div>

    <!-- 스크롤 영역 -->
    <div class="scroll-area">

      <!-- 프로필 카드 -->
      <div class="profile-card">
        <div class="profile-top">
          <div class="avatar">🌿</div>
          <div class="profile-info">
            <div class="profile-name">닉네임님</div>
            <div class="profile-sub">오늘도 한 걸음 나아가고 있어요</div>
          </div>
        </div>

        <div class="divider-thin"></div>

        <div class="challenge-label">100일 챌린지</div>
        <div class="challenge-row">
          <span class="challenge-name">🌱 산책 챌린지</span>
          <span class="challenge-meta">D-67 · 완수 33%</span>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill"></div>
        </div>

        <div class="point-row">
          <span class="point-label">🍀 누적 스탬프</span>
          <span class="point-value">33<span class="point-unit">개</span></span>
        </div>
      </div>

      <!-- 주요 메뉴 -->
      <div class="menu-card">
        <div class="menu-item">
          <div class="menu-left">
            <span class="menu-icon">⚙</span>
            설정
          </div>
          <span class="menu-arrow">›</span>
        </div>
      </div>

      <!-- 내 게시글 피드 (인스타 스타일) -->
      <div class="section-title">내 게시글</div>
      <div class="feed-grid">
        <div class="feed-thumb"></div>
        <div class="feed-thumb"></div>
        <div class="feed-thumb"></div>
        <div class="feed-thumb"></div>
        <div class="feed-thumb"></div>
        <div class="feed-thumb"></div>
        <div class="feed-thumb"></div>
        <div class="feed-thumb"></div>
        <div class="feed-thumb"></div>
      </div>

    </div>

    <!-- 하단 네비게이션 -->
    <div class="bottom-nav">
      <div class="nav-item">
        <span class="nav-icon">📔</span>
        <div class="nav-dot hidden"></div>
      </div>
      <div class="nav-item">
        <span class="nav-icon">🏠</span>
        <div class="nav-dot hidden"></div>
      </div>
      <div class="nav-item">
        <span class="nav-icon active">👤</span>
        <div class="nav-dot"></div>
      </div>
    </div>

  </div>
</body>
</html>
