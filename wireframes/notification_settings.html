<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=375" />
  <title>ShallWe — 알림 설정</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 40px;
      font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    }
    .phone {
      width: 375px;
      min-height: 812px;
      background: #fff;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      padding: 14px 24px 8px;
      font-size: 12px;
      font-weight: 600;
      color: #1a1a1a;
    }
    .status-right { display: flex; gap: 6px; font-size: 11px; }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 24px 16px;
    }
    .back-btn { font-size: 20px; color: #1a1a1a; cursor: pointer; }
    .header-title { font-size: 18px; font-weight: 700; color: #1a1a1a; }

    .scroll-area { flex: 1; overflow-y: auto; padding: 0 20px 32px; }

    .section-label {
      font-size: 12px;
      font-weight: 600;
      color: #999;
      margin: 20px 0 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .section-label:first-child { margin-top: 0; }

    .notify-card {
      background: #f7f9f7;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .notify-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
    }
    .notify-item + .notify-item { border-top: 1px solid #eee; }

    .notify-left { display: flex; align-items: flex-start; gap: 12px; }
    .notify-icon { font-size: 20px; margin-top: 1px; }
    .notify-info {}
    .notify-name { font-size: 14px; font-weight: 600; color: #1a1a1a; margin-bottom: 3px; }
    .notify-desc { font-size: 12px; color: #aaa; line-height: 1.4; }

    /* iOS 스타일 토글 */
    .toggle {
      width: 48px;
      height: 28px;
      border-radius: 14px;
      background: #e0e0e0;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .toggle.on { background: #4caf7d; }
    .toggle::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: #fff;
      border-radius: 50%;
      top: 3px;
      left: 3px;
      transition: left 0.2s;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
    }
    .toggle.on::after { left: 23px; }

    /* 시간 설정 행 */
    .time-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 18px;
      border-top: 1px solid #eee;
    }
    .time-label { font-size: 13px; color: #555; }
    .time-value {
      font-size: 14px;
      font-weight: 600;
      color: #4caf7d;
    }

    .info-box {
      background: #edf7f1;
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-top: 4px;
    }
    .info-icon { font-size: 16px; flex-shrink: 0; }
    .info-text { font-size: 12px; color: #4caf7d; line-height: 1.5; font-weight: 500; }

    /* 하단 탭바 */
    .tab-bar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 0 28px;
      border-top: 1px solid #eee;
      background: #fff;
    }
    .tab-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      color: #bbb;
      text-decoration: none;
      cursor: pointer;
    }
    .tab-item.active { color: #4caf7d; }
    .tab-icon { font-size: 20px; }
  </style>
</head>
<body>
<div class="phone">
  <div class="status-bar">
    <span>9:41</span>
    <div class="status-right"><span>●●●</span><span>🔋</span></div>
  </div>

  <div class="header">
    <span class="back-btn">←</span>
    <span class="header-title">알림 설정</span>
  </div>

  <div class="scroll-area">

    <div class="section-label">챌린지</div>
    <div class="notify-card">
      <div class="notify-item">
        <div class="notify-left">
          <div class="notify-icon">🍀</div>
          <div class="notify-info">
            <div class="notify-name">챌린지 리마인더</div>
            <div class="notify-desc">당일 인증 전에 알려드려요</div>
          </div>
        </div>
        <div class="toggle on"></div>
      </div>
      <div class="time-row">
        <span class="time-label">알림 시간</span>
        <span class="time-value">오전 9:00 ›</span>
      </div>
    </div>

    <div class="section-label">AI 다이어리</div>
    <div class="notify-card">
      <div class="notify-item">
        <div class="notify-left">
          <div class="notify-icon">📔</div>
          <div class="notify-info">
            <div class="notify-name">다이어리 작성 알림</div>
            <div class="notify-desc">당일 기록이 없을 때 알려드려요</div>
          </div>
        </div>
        <div class="toggle on"></div>
      </div>
      <div class="time-row">
        <span class="time-label">알림 시간</span>
        <span class="time-value">오후 9:00 ›</span>
      </div>
    </div>

    <div class="section-label">AI 감정 알림</div>
    <div class="notify-card">
      <div class="notify-item">
        <div class="notify-left">
          <div class="notify-icon">🤖</div>
          <div class="notify-info">
            <div class="notify-name">감정 감지 알림</div>
            <div class="notify-desc">다이어리 저장 후 AI가 감정을<br>분석하면 알려드려요</div>
          </div>
        </div>
        <div class="toggle on"></div>
      </div>
    </div>

    <div class="info-box">
      <div class="info-icon">💚</div>
      <div class="info-text">
        AI 감정 알림은 부정적인 감정이 감지될 때<br>
        "50% 완수했고, 반밖에 안 남았어!" 같은<br>
        따뜻한 메시지를 보내드려요
      </div>
    </div>

  </div>

  <div class="tab-bar">
    <div class="tab-item">
      <span class="tab-icon">📖</span>
      <span>다이어리</span>
    </div>
    <div class="tab-item">
      <span class="tab-icon">🏠</span>
      <span>홈</span>
    </div>
    <div class="tab-item">
      <span class="tab-icon">✅</span>
      <span>인증</span>
    </div>
    <div class="tab-item active">
      <span class="tab-icon">👤</span>
      <span>마이</span>
    </div>
  </div>
</div>
</body>
</html>
